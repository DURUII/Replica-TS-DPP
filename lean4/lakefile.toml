name = "TSDPP"
defaultTargets = ["TSDPP"]
version = "0.1.0"

# `lake lint` was previously dead: without a lint driver Lake errors out with
# "no lint driver configured and builtin linting is disabled".  `batteries/runLinter` is the
# same driver mathlib uses (`.lake/packages/mathlib/lakefile.lean:58`); `lintDriverArgs` names
# the module to lint, so that `lake lint` == `lake exe batteries/runLinter TSDPP`.
lintDriver = "batteries/runLinter"
lintDriverArgs = ["TSDPP"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f61f3ed7633ff99ecaae4a086395b501652a76ee"

# The axiom audit driver (`lake exe axiom-audit`).  Deliberately dependency-free: it imports only
# Lean core and loads the audited modules at runtime, so it adds no transitive closure to resolve.
# Pinned to an exact revision for the same reason mathlib is: the gate must not change under the
# artifact's feet.  `scripts/check_axioms.sh` explains why the audit is delegated to it rather than
# hand-rolled, and which parts are deliberately *not* delegated.
[[require]]
name = "axiom-audit"
git = "https://github.com/leanprover-community/axiom-audit"
rev = "0b885d88a69982cd76990b502742690b80b1a685"

[[lean_lib]]
name = "TSDPP"
